name: ${COMPOSE_PROJECT_NAME:-salon}
# All values are interpolated from ONE file: `.env` by default, or the one given with
# `docker compose --env-file .env.otro ...`. There is no separate env_file, so the database
# password, secrets, ports and project name can never come from different files.
x-backend: &backend
  build:
    context: .
    dockerfile: docker/Dockerfile.backend
  environment:
    DATABASE_URL: postgresql://salon_app:${DATABASE_PASSWORD:?Define DATABASE_PASSWORD}@postgres:5432/salon?schema=public
    JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET}
    PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:?Define PUBLIC_WEB_URL}
    SALON_NAME: ${SALON_NAME:-}
    SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
    SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    ACCESS_TOKEN: ${ACCESS_TOKEN:-}
    MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-}
    MP_WEBHOOK_URL: ${MP_WEBHOOK_URL:-}
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_SECURE: ${SMTP_SECURE:-false}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    SMTP_FROM: ${SMTP_FROM:-}
    BACKGROUND_JOBS: ${BACKGROUND_JOBS:-true}
  networks: [private]
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
      POSTGRES_DB: salon
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Define DATABASE_PASSWORD}
    volumes:
      - salon_data:/var/lib/postgresql/data
      - ./docker/init-database.sh:/docker-entrypoint-initdb.d/10-app-user.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d salon']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [private]
    restart: unless-stopped
  migrate:
    <<: *backend
    command: [npm, run, db:migrate]
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'
  setup:
    <<: *backend
    profiles: [setup]
    command: [npm, run, db:seed]
    depends_on:
      migrate: { condition: service_completed_successfully }
  backend:
    <<: *backend
    volumes:
      - salon_uploads:/srv/app/uploads
    ports: ['127.0.0.1:${API_PORT:-4000}:4000']
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          'fetch("http://localhost:4000/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    environment:
      API_SERVER_URL: http://backend:4000
    ports: ['127.0.0.1:${WEB_PORT:-3000}:3000']
    depends_on:
      backend: { condition: service_healthy }
    networks: [private]
    restart: unless-stopped
networks:
  private:
volumes:
  salon_data:
  salon_uploads:
