name: peluqueria-saas
x-backend-common: &backend
  build:
    context: .
    dockerfile: Dockerfile.backend
  env_file: .env
  environment:
    INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    MANAGER_URL: http://tenant-manager:4004
  networks: [private]
  restart: unless-stopped
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U $$POSTGRES_USER -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [private]
  migrate:
    <<: *backend
    restart: "no"
    command: ["sh","-c","npm run db:migrate && npm run db:seed"]
    depends_on:
      postgres: {condition: service_healthy}
  tenant-manager:
    <<: *backend
    command: ["node","dist/apps/tenant-manager/src/main.js"]
    depends_on:
      migrate: {condition: service_completed_successfully}
  catalog:
    <<: *backend
    command: ["node","dist/apps/catalog-service/src/main.js"]
    depends_on: [tenant-manager]
  reservations:
    <<: *backend
    command: ["node","dist/apps/reservations-service/src/main.js"]
    environment:
      MANAGER_URL: http://tenant-manager:4004
      CATALOG_URL: http://catalog:4001
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    depends_on: [catalog]
  payments:
    <<: *backend
    command: ["node","dist/apps/payments-service/src/main.js"]
    environment:
      MANAGER_URL: http://tenant-manager:4004
      RESERVATIONS_URL: http://reservations:4002
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      ACCESS_TOKEN: ${ACCESS_TOKEN:-}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-}
      MP_WEBHOOK_URL: ${MP_WEBHOOK_URL:-}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
    depends_on: [reservations]
  auth:
    <<: *backend
    command: ["node","dist/apps/auth-service/src/main.js"]
    depends_on: [tenant-manager]
  gateway:
    <<: *backend
    command: ["node","dist/apps/gateway/src/main.js"]
    environment:
      MANAGER_URL: http://tenant-manager:4004
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      CATALOG_URL: http://catalog:4001
      RESERVATIONS_URL: http://reservations:4002
      PAYMENTS_URL: http://payments:4003
      AUTH_URL: http://auth:4005
    ports: ["127.0.0.1:4000:4000"]
    depends_on: [catalog,reservations,payments,auth]
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_TENANT_ID: ${NEXT_PUBLIC_TENANT_ID}
    environment:
      API_SERVER_URL: http://gateway:4000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      NEXT_PUBLIC_TENANT_ID: ${NEXT_PUBLIC_TENANT_ID}
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [gateway]
    networks: [private]
    restart: unless-stopped
networks:
  private:
volumes:
  postgres_data:
